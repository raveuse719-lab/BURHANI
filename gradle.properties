# Specifies the JVM arguments used for the daemon process.
# Reduced to 2048m with G1GC to prevent OOM / hanging on GitHub Actions runners.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
# Disable parallel execution for single-module builds to avoid thread contention on 2-core runners.
org.gradle.parallel=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Set the maximum number of workers to 2 to match GitHub Actions runner capacity.
org.gradle.workers.max=2
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=35
